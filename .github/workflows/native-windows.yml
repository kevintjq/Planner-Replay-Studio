name: Native Windows compatibility build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'assets/icons/**'
      - 'docs/**'
      - 'README.md'
      - 'README_CN.md'
      - 'app-metadata.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'native/**'
      - 'assets/icons/**'
      - 'docs/**'
      - 'README.md'
      - 'README_CN.md'
      - 'app-metadata.json'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia qtsvg qtimageformats
          cache: true
      - name: Install native dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install bzip2:x64-windows-static-md lz4:x64-windows-static-md yaml-cpp:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache OpenCV
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/planner-opencv
          key: opencv-4.10.0-win-x64-msvc-tracking-videoio-v1
      - name: Build OpenCV tracking and video I/O
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'planner-opencv'
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git opencv-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv_contrib.git opencv-contrib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S opencv-source -B opencv-build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_INSTALL_PREFIX=$target" "-DOPENCV_EXTRA_MODULES_PATH=$PWD/opencv-contrib/modules" `
            "-DBUILD_LIST=core,imgproc,photo,tracking,videoio" -DBUILD_SHARED_LIBS=ON `
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF `
            -DBUILD_opencv_python3=OFF -DBUILD_JAVA=OFF -DWITH_IPP=OFF -DWITH_OPENCL=OFF -DWITH_FFMPEG=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build opencv-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install opencv-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item opencv-source/LICENSE "$target/opencv-LICENSE.txt"
          Copy-Item opencv-source/3rdparty/ffmpeg/license.txt "$target/opencv-ffmpeg-LICENSE.txt"
      - name: Prepare FFmpeg for export regression
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-7.1.1-full_build-shared.zip'
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-full_build-shared.zip'
          Invoke-WebRequest $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '9f28727e8b472a04c1d2e520aaa425dca82721b995139b35710091130ea6e699') {
            throw 'FFmpeg tool archive did not match the pinned SHA-256.'
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          (Join-Path $env:RUNNER_TEMP 'ffmpeg-7.1.1-full_build-shared/bin') >> $env:GITHUB_PATH
          "FFmpeg_ROOT=$(Join-Path $env:RUNNER_TEMP 'ffmpeg-7.1.1-full_build-shared')" >> $env:GITHUB_ENV
      - name: Build and test
        shell: pwsh
        run: |
          $opencv = Join-Path $env:RUNNER_TEMP 'planner-opencv'
          $opencvBins = Get-ChildItem $opencv -Recurse -File -Filter 'opencv*.dll' | Select-Object -ExpandProperty DirectoryName -Unique
          if (!$opencvBins) { throw 'OpenCV shared libraries were not found.' }
          $env:PATH = ($opencvBins -join ';') + ';' + $env:PATH
          cmake -S native -B build-native "-DOpenCV_DIR=$opencv" -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=x64-windows-static-md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-native --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Hosted compatibility checks use Qt's software backend. CloudView's
          # actual OpenGL test remains a separate mandatory release gate; it is
          # not skipped and then reported as passed here. Keep the unavailable-
          # GPU timeout and native/stale-frame substitution rejection tests.
          $savedPlatform = $env:QT_QPA_PLATFORM
          $savedBackend = $env:QT_QUICK_BACKEND
          try {
            $env:QT_QPA_PLATFORM = 'offscreen'
            $env:QT_QUICK_BACKEND = 'software'
            ctest --test-dir build-native -C Release --output-on-failure -E '^movie_gpu_preflight$'
            if ($LASTEXITCODE -ne 0) { throw 'Hosted software compatibility tests failed.' }
          } finally {
            $env:QT_QPA_PLATFORM = $savedPlatform
            $env:QT_QUICK_BACKEND = $savedBackend
          }
          ./native/tools/test-windows-runtime-payload.ps1
          if (!$?) { throw 'Windows standalone payload guard regression failed.' }
          ./native/tools/test-windows-staging-input.ps1
          if (!$?) { throw 'Fresh Windows staging regression failed.' }
          ./native/tools/test-windows-documentation.ps1
          if (!$?) { throw 'Windows offline documentation regression failed.' }
          ./native/tools/test-release-gates.ps1
          if (!$?) { throw 'Artifact-only release policy regression failed.' }
          ./native/tools/check-windows-packaging.ps1
          if (!$?) { throw 'Windows packaging source/resource audit failed.' }
      - name: Build the Windows installer
        shell: pwsh
        run: |
          ./native/tools/sync-project-metadata.ps1
          if (!$?) { throw 'Product metadata and README are out of sync.' }
          $metadata = Get-Content app-metadata.json -Raw | ConvertFrom-Json
          $version = $metadata.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid central product version.' }
          $displayVersion = "$version-development.$($env:GITHUB_SHA.Substring(0, 12))"
          cmake --install build-native --config Release --prefix dist/uav-studio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./native/installer/package.ps1 -AppDirectory dist/uav-studio -SetupFile dist/uav-studio-Setup.exe -Version $version -DisplayVersion $displayVersion -QtVersion $env:QT_VERSION -OpenCvDirectory (Join-Path $env:RUNNER_TEMP 'planner-opencv')
          $backend = Get-Content dist/uav-studio/native-rviz-backend.json -Raw | ConvertFrom-Json
          $runtime = Get-Content dist/uav-studio/windows-runtime.json -Raw | ConvertFrom-Json
          if ($backend.included -or $backend.package_profile -ne 'Standalone' -or $runtime.profile -ne 'Standalone' -or (Test-Path dist/uav-studio/rviz_host)) {
            throw 'The default Windows installer must contain the standalone profile only.'
          }
      # This constrains environment lookup on the runner. It is not a no-WSL clean VM.
      - name: Verify standalone install, software 2D/codecs and uninstall
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = (Resolve-Path dist/uav-studio-Setup.exe).Path
          $target = Join-Path $env:RUNNER_TEMP 'PlannerReplayInstallerSmoke'
          $install = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$target" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)." }
          $exe = Join-Path $target 'app/uav-studio.exe'
          $cli = Join-Path $target 'app/uav-studio-cli.exe'
          $uninstaller = Join-Path $target 'Uninstall.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'UAV Studio.lnk'
          if (!(Test-Path $exe) -or !(Test-Path $cli) -or !(Test-Path $uninstaller) -or !(Test-Path $shortcut)) {
            throw 'The installed application, uninstaller or Start menu shortcut is missing.'
          }
          $applicationHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          $registry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\UAVStudio'
          $command = Get-ItemPropertyValue -Path $registry -Name UninstallString -ErrorAction Stop
          if ($command -ne ('"' + $uninstaller + '"')) {
            throw 'Windows Apps settings does not have a valid uninstall command.'
          }
          $pythonRuntime = Get-ChildItem -Path (Join-Path $target 'app') -File -Recurse |
            Where-Object { $_.Name -match '^python.*\.(dll|exe)$' -or $_.Extension -in '.py', '.pyd', '.pyc' }
          if ($pythonRuntime) { throw "Unexpected Python runtime: $($pythonRuntime.Name)" }
          . ./native/installer/native-rviz-host.ps1
          $payloadAudit = Assert-WindowsRuntimePayload (Join-Path $target 'app')
          $payloadAudit | ConvertTo-Json -Depth 5 | Set-Content dist/standalone-payload-audit.json
          $fixture = Join-Path $env:RUNNER_TEMP 'planner-replay-video-smoke.mp4'
          $ffmpeg = Join-Path $target 'app/ffmpeg.exe'
          & $ffmpeg -v error -y -f lavfi -i 'testsrc2=size=1920x1080:rate=60:duration=3' -c:v libx264 -preset veryfast -g 180 -bf 2 -pix_fmt yuv420p $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate the video smoke fixture.' }
          $savedEnvironment = @{}
          $environmentNames = @('PATH', 'QT_PLUGIN_PATH', 'QML_IMPORT_PATH', 'QML2_IMPORT_PATH', 'QT_QPA_PLATFORM', 'QT_QUICK_BACKEND')
          $environmentNames += @([Environment]::GetEnvironmentVariables('Process').Keys | Where-Object {
            $_ -match '^(QT|QSG|QML|UAV_STUDIO|ROS|AMENT|COLCON|CATKIN|CONDA)_' -or $_ -match '^PYTHON' -or $_ -in @('VIRTUAL_ENV', 'CMAKE_PREFIX_PATH', 'LD_LIBRARY_PATH')
          })
          foreach ($name in @($environmentNames | Select-Object -Unique)) {
            $savedEnvironment[$name] = [Environment]::GetEnvironmentVariable($name, 'Process')
          }
          function RunCompatibilitySmoke([string]$program, [string[]]$programArguments, [string]$name, [int]$timeoutSeconds = 45) {
            $stdout = [IO.Path]::GetFullPath("dist/compatibility-$name.out.log")
            $stderr = [IO.Path]::GetFullPath("dist/compatibility-$name.err.log")
            $process = Start-Process -FilePath $program -ArgumentList $programArguments -WorkingDirectory $target -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (!$process.WaitForExit($timeoutSeconds * 1000)) {
              # This process tree belongs only to the current smoke invocation.
              & "$env:SystemRoot/System32/taskkill.exe" /PID $process.Id /T /F | Out-Null
              throw "Installed compatibility smoke $name timed out."
            }
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "Installed compatibility smoke $name exited with $($process.ExitCode). $(Get-Content -LiteralPath $stderr -Raw)" }
          }
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            foreach ($name in $savedEnvironment.Keys | Where-Object { $_ -ne 'PATH' }) {
              [Environment]::SetEnvironmentVariable($name, $null, 'Process')
            }
            $env:QT_QPA_PLATFORM = 'offscreen'
            $env:QT_QUICK_BACKEND = 'software'
            # These existing entry points check QML layout, 2D alpha, codec/audio
            # output, project/video state and CLI startup. None certifies 3D.
            $layoutPng = [IO.Path]::GetFullPath('dist/compatibility-layout-2d.png')
            RunCompatibilitySmoke $exe @('--smoke-layout', ('"' + $layoutPng + '"')) 'layout-2d'
            if (!(Test-Path -LiteralPath $layoutPng -PathType Leaf)) { throw 'The installed 2D layout smoke did not save its image.' }
            RunCompatibilitySmoke $exe @('--smoke-png') 'alpha-2d'
            RunCompatibilitySmoke $exe @('--smoke-mp4') 'h264-aac-codecs' 60
            RunCompatibilitySmoke $exe @('--smoke', ('"' + $fixture + '"')) 'project-video-state'
            RunCompatibilitySmoke $cli @('--help') 'cli-help'
          } finally {
            foreach ($entry in $savedEnvironment.GetEnumerator()) {
              [Environment]::SetEnvironmentVariable($entry.Key, $entry.Value, 'Process')
            }
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $exe) -or (Test-Path $shortcut) -or (Test-Path $registry)) {
            throw 'The uninstaller did not remove the application, shortcut and registry entry.'
          }
          [ordered]@{
            kind = 'standalone-software-compatibility-ci'
            source_commit = $env:GITHUB_SHA
            application_sha256 = $applicationHash
            installer_sha256 = (Get-FileHash -LiteralPath $setup).Hash
            install_software_smoke_uninstall = $true
            software_checks = @('qml-layout', '2d-transparent-png', 'h264-aac-codecs', 'project-video-state', 'cli-help')
            gpu_export_verified = $false; manual_gui_acceptance = $false
            clean_windows_without_wsl_verified = $false; runnable_distribution_verified = $false
            required_release_gates = @('Current build core image/video output on real Windows/OpenGL', 'Current installed package new-package-runtime-check.ps1 on real Windows/OpenGL', 'Necessary four-workspace core end-to-end GUI, complete dependencies and safe-upgrade gates in docs/V1_CORE_RELEASE_SCOPE_CN.md')
            limit = 'Software-only compatibility evidence. Minimal PATH does not prove a clean OS; no CloudView/3D output was accepted.'
          } | ConvertTo-Json | Set-Content dist/standalone-runtime-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: uav-studio-Windows-x64-development
          path: |
            dist/uav-studio-Setup.exe
            dist/standalone-payload-audit.json
            dist/standalone-runtime-check.json
            dist/compatibility-*
          if-no-files-found: error
      # Development artifacts only: necessary four-workspace core end-to-end GUI,
      # real OpenGL output, installed-package dependencies and safe upgrades remain mandatory.
      # Nonblocking UI details, edge compatibility and exhaustive combinations are
      # assigned to user post-install testing and follow-up PRs, without claiming passed.
      # Clean-Windows install/run testing is assigned to the user after release;
      # its unverified evidence field remains false and is not a release gate.
      # Run movie_gpu_preflight and native/tools/new-package-runtime-check.ps1
      # against the same build/package on a real Windows/OpenGL desktop. Their
      # evidence is separate from this hosted software-only compatibility job.
      # No preview/stable release is published or existing release retagged here.

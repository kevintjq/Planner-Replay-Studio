name: Native Windows compatibility build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native-windows.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-windows.yml'

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Install native dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install bzip2:x64-windows-static-md lz4:x64-windows-static-md yaml-cpp:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache OpenCV
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/planner-opencv
          key: opencv-4.10.0-win-x64-msvc-tracking-videoio-v1
      - name: Build OpenCV tracking and video I/O
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'planner-opencv'
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git opencv-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv_contrib.git opencv-contrib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S opencv-source -B opencv-build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_INSTALL_PREFIX=$target" "-DOPENCV_EXTRA_MODULES_PATH=$PWD/opencv-contrib/modules" `
            "-DBUILD_LIST=core,imgproc,photo,tracking,videoio" -DBUILD_SHARED_LIBS=ON `
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF `
            -DBUILD_opencv_python3=OFF -DBUILD_JAVA=OFF -DWITH_IPP=OFF -DWITH_OPENCL=OFF -DWITH_FFMPEG=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build opencv-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install opencv-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item opencv-source/LICENSE "$target/opencv-LICENSE.txt"
          Copy-Item opencv-source/3rdparty/ffmpeg/license.txt "$target/opencv-ffmpeg-LICENSE.txt"
      - name: Prepare FFmpeg for export regression
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-7.1.1-essentials_build.zip'
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip'
          Invoke-WebRequest $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4') {
            throw 'FFmpeg tool archive did not match the pinned SHA-256.'
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          (Join-Path $env:RUNNER_TEMP 'ffmpeg-7.1.1-essentials_build/bin') >> $env:GITHUB_PATH
      - name: Build and test
        shell: pwsh
        run: |
          $opencv = Join-Path $env:RUNNER_TEMP 'planner-opencv'
          $opencvBins = Get-ChildItem $opencv -Recurse -File -Filter 'opencv*.dll' | Select-Object -ExpandProperty DirectoryName -Unique
          if (!$opencvBins) { throw 'OpenCV shared libraries were not found.' }
          $env:PATH = ($opencvBins -join ';') + ';' + $env:PATH
          cmake -S native -B build-native "-DOpenCV_DIR=$opencv" -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=x64-windows-static-md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-native --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-native -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the Windows installer
        shell: pwsh
        run: |
          $match = Select-String -Path native/CMakeLists.txt -Pattern '^project\(PlannerReplayNative VERSION (\d+\.\d+\.\d+) '
          if (!$match) { throw 'Could not read the native app version.' }
          $version = $match.Matches[0].Groups[1].Value
          cmake --install build-native --config Release --prefix dist/PlannerReplayNative
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./native/installer/package.ps1 -AppDirectory dist/PlannerReplayNative -SetupFile dist/PlannerReplayNative-Setup.exe -Version $version -QtVersion $env:QT_VERSION -OpenCvDirectory (Join-Path $env:RUNNER_TEMP 'planner-opencv')
      - name: Verify install, launch and uninstall
        timeout-minutes: 3
        shell: pwsh
        run: |
          $setup = (Resolve-Path dist/PlannerReplayNative-Setup.exe).Path
          $target = Join-Path $env:RUNNER_TEMP 'PlannerReplayInstallerSmoke'
          $install = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)." }
          $exe = Join-Path $target 'app/PlannerReplayNative.exe'
          $cli = Join-Path $target 'app/PlannerReplayCli.exe'
          $uninstaller = Join-Path $target 'Uninstall.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Planner Replay Studio.lnk'
          if (!(Test-Path $exe) -or !(Test-Path $cli) -or !(Test-Path $uninstaller) -or !(Test-Path $shortcut)) {
            throw 'The installed application, uninstaller or Start menu shortcut is missing.'
          }
          $registry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PlannerReplayNative'
          $command = Get-ItemPropertyValue -Path $registry -Name UninstallString -ErrorAction Stop
          if ($command -ne ('"' + $uninstaller + '"')) {
            throw 'Windows Apps settings does not have a valid uninstall command.'
          }
          $pythonRuntime = Get-ChildItem -Path (Join-Path $target 'app') -File -Recurse |
            Where-Object { $_.Name -match '^python.*\.(dll|exe)$' -or $_.Extension -in '.py', '.pyd', '.pyc' }
          if ($pythonRuntime) { throw "Unexpected Python runtime: $($pythonRuntime.Name)" }
          $fixture = Join-Path $env:RUNNER_TEMP 'planner-replay-video-smoke.mp4'
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (!$ffmpeg) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Could not install FFmpeg to generate the video fixture.' }
            $ffmpeg = Get-Command "$env:ChocolateyInstall/bin/ffmpeg.exe"
          }
          & $ffmpeg.Source -v error -y -f lavfi -i 'testsrc2=size=1920x1080:rate=60:duration=3' -c:v libx264 -preset veryfast -g 180 -bf 2 -pix_fmt yuv420p $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate the video smoke fixture.' }
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:QT_PLUGIN_PATH, Env:QML_IMPORT_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
            $app = Start-Process -FilePath $exe -ArgumentList '--smoke', ('"' + $fixture + '"') -WorkingDirectory $target -Wait -PassThru
            if ($app.ExitCode -ne 0) { throw "Installed application exited with $($app.ExitCode)." }
            $env:QT_QPA_PLATFORM = 'windows'
            $env:QT_QUICK_BACKEND = 'software'
            $batchPng = Join-Path $env:RUNNER_TEMP 'planner-batch-smoke.png'
            $batchErr = Join-Path $env:RUNNER_TEMP 'planner-batch-smoke.err'
            $batch = Start-Process -FilePath $cli -ArgumentList 'demo', '--start', '0.25', '--output', ('"' + $batchPng + '"') -RedirectStandardError $batchErr -PassThru
            if (!$batch.WaitForExit(45000)) {
              Stop-Process -Id $batch.Id -Force
              throw 'The installed CLI did not exit within 45 seconds.'
            }
            if ($batch.ExitCode -ne 0 -or !(Test-Path $batchPng)) {
              throw "The installed CLI did not export a PNG. $(Get-Content $batchErr -Raw)"
            }
            Remove-Item Env:QT_QPA_PLATFORM, Env:QT_QUICK_BACKEND -ErrorAction SilentlyContinue
          } finally {
            $env:PATH = $originalPath
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $exe) -or (Test-Path $shortcut) -or (Test-Path $registry)) {
            throw 'The uninstaller did not remove the application, shortcut and registry entry.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PlannerReplayNative-Windows-x64
          path: dist/PlannerReplayNative-Setup.exe
          if-no-files-found: error

  prerelease:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: native-windows-prerelease
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PlannerReplayNative-Windows-x64
          path: installer
      - name: Publish the verified C++ Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="native-v0.1.1-preview"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" installer/PlannerReplayNative-Setup.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Planner Replay Studio C++ Preview (${GITHUB_SHA:0:7})" \
            --notes "Windows x64 C++ preview. The installer has passed the Windows install, launch, export and uninstall checks. MP4 export requires FFmpeg. Legacy feature parity is still in progress."

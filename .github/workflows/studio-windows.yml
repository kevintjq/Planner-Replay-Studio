name: Complete Windows workspace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/windows/**'
      - 'native/installer/**'
      - 'native/tools/*windows*.ps1'
      - 'app-metadata.json'
      - 'pyproject.toml'
      - '.github/workflows/studio-windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/windows/**'
      - 'native/installer/**'
      - 'native/tools/*windows*.ps1'
      - 'app-metadata.json'
      - 'pyproject.toml'
      - '.github/workflows/studio-windows.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run full workspace regression suite
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libegl1
          python -m pip install '.[test]'
          xvfb-run -a python -m pytest -q

  package:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.bundle.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Test installer locations and shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          $compiler = if ($nsis) { $nsis.Source } else { "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          . ./native/installer/windows-package.ps1
          $metadata = Get-Content app-metadata.json -Raw | ConvertFrom-Json
          $runId = [Guid]::NewGuid().ToString('N').Substring(0,12)
          $product = "Planner Replay Installer Test $runId"
          $productId = "UAVStudioHistoricalInstallerAcceptance$runId"
          $associationRoot = "Software\UAVStudioHistoricalInstallerAcceptance\$runId\Classes"
          $fixture = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'planner-installer-fixture')
          # Use a real x64 PE only as non-executed installer input. A text file
          # with an .exe suffix cannot pass staged executable validation.
          Copy-Item "$env:SystemRoot/System32/whoami.exe" (Join-Path $fixture.FullName 'test.exe')
          $manifest = Write-WindowsInstallManifest $fixture.FullName $productId '1.0.0' $product 'test.exe'
          $setup = Join-Path $env:RUNNER_TEMP 'planner-installer-test.exe'
          $desktopDirectory = Join-Path $env:RUNNER_TEMP 'planner-installer-desktop'
          $startDirectory = Join-Path $env:RUNNER_TEMP 'planner-installer-start'
          $defines = @("/DAPP_DIR=$($fixture.FullName)", "/DSETUP_FILE=$setup", '/DVERSION=1.0.0',
            "/DPRODUCT=$product", "/DPRODUCT_ID=$productId", '/DAPP_EXE=test.exe', "/DASSOCIATION_ROOT=$associationRoot",
            "/DSTARTMENU_DIRECTORY=$startDirectory", "/DDESKTOP_DIRECTORY=$desktopDirectory",
            "/DINSTALL_MANIFEST_SHA256=$($manifest.sha256)", "/DAUTHOR=$($metadata.author)", "/DPROJECT_URL=$($metadata.github_url)", "/DCONTACT_EMAIL=$($metadata.email)")
          & $compiler /WX @defines native/installer/windows.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $desktop = Join-Path $desktopDirectory "$product.lnk"
          $start = Join-Path $startDirectory "$product.lnk"
          $registry = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$productId"
          $default = Join-Path $env:LOCALAPPDATA "Programs/$product"
          $custom = Join-Path $env:RUNNER_TEMP 'Planner Replay custom location'

          function Test-Install($Expected, $Arguments, $DesktopExpected) {
            $process = Start-Process $setup -ArgumentList $Arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer failed with $($process.ExitCode)" }
            $exe = Join-Path $Expected 'app/test.exe'
            if (!(Test-Path $exe) -or (Get-ItemPropertyValue $registry InstallLocation) -ne $Expected) {
              throw "Unexpected installation directory: $Expected"
            }
            if (!(Test-Path $start) -or (Test-Path $desktop) -ne $DesktopExpected) {
              throw 'Start menu or desktop shortcut does not match installer choices.'
            }
            if ($DesktopExpected) {
              $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($desktop)
              if ($shortcut.TargetPath -ne $exe) { throw 'Desktop shortcut points to the wrong executable.' }
            }
          }

          function Test-Uninstall($Expected) {
            $keep = Join-Path $Expected 'user-file.txt'
            Set-Content $keep 'keep'
            $process = Start-Process (Join-Path $Expected 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0 -or (Test-Path (Join-Path $Expected 'app')) -or (Test-Path $start) -or
                (Test-Path $desktop) -or (Test-Path $registry) -or !(Test-Path $keep)) {
              throw 'Uninstall did not remove only the app and its shortcuts.'
            }
          }

          Test-Install $default '/S' $false
          Test-Uninstall $default
          Test-Install $custom "/S /DESKTOPSHORTCUT=1 /D=$custom" $true
          $before = (Get-FileHash (Join-Path $custom 'app/test.exe')).Hash
          $upgrade = Start-Process $setup -ArgumentList '/S', '/DESKTOPSHORTCUT=0' -WindowStyle Hidden -Wait -PassThru
          $transaction = Get-Content (Join-Path $custom 'last-install-transaction.json') -Raw | ConvertFrom-Json
          if ($upgrade.ExitCode -ne 0 -or (Get-FileHash (Join-Path $custom 'app/test.exe')).Hash -ne $before -or (Test-Path $desktop) -or
              (Get-FileHash (Join-Path $transaction.backup 'app/test.exe')).Hash -ne $before) {
            throw 'A trusted same-path installation must upgrade with the old payload retained in backup.'
          }
          Test-Uninstall $custom
          Remove-Item -LiteralPath "HKCU:\Software\UAVStudioHistoricalInstallerAcceptance\$runId" -Recurse -Force
      - name: Freeze the complete workspace
        id: bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install ".[test]" "pyinstaller>=6.18,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The Windows runner has no usable OpenGL context. The graphics test runs in the Linux regression job.
          python -m pytest -q tests/test_project_file.py tests/test_export_media.py tests/test_cloud.py tests/test_speed_settings.py tests/test_rviz_config.py tests/test_trajectory_image.py tests/test_footage.py -k "not test_preview_and_export_apply_same_video_time_and_position"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          $options = @('--noconfirm', '--clean', '--onedir', '--windowed', '--noupx',
            '--name', 'PlannerReplayStudio', '--workpath', 'build/studio', '--specpath', 'build/studio',
            '--distpath', 'dist', '--collect-all', 'vtkmodules', '--collect-all', 'imageio_ffmpeg',
            '--collect-submodules', 'rosbags',
            '--recursive-copy-metadata', 'planner-replay-studio', '--hidden-import', 'imageio.plugins.ffmpeg',
            '--hidden-import', 'imageio.plugins.pillow', 'packaging/windows/studio_entry.py')
          python -m PyInstaller @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $frozenApp = (Resolve-Path dist/PlannerReplayStudio/PlannerReplayStudio.exe).Path
          $frozenLog = Join-Path $env:RUNNER_TEMP 'planner-replay-studio-frozen.txt'
          $check = Start-Process -FilePath $frozenApp -ArgumentList '--smoke', ('"' + $frozenLog + '"') -Wait -PassThru
          if (Test-Path $frozenLog) { Get-Content $frozenLog }
          if ($check.ExitCode -ne 0) { throw "Frozen workspace smoke test failed with $($check.ExitCode)." }
          Copy-Item LICENSE, docs/studio.md, docs/studio.zh-CN.md dist/PlannerReplayStudio/
          $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          $compiler = if ($nsis) { $nsis.Source } else { "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          $bundle = (Resolve-Path dist/PlannerReplayStudio).Path
          $setup = Join-Path (Resolve-Path dist).Path 'PlannerReplayStudio-Setup.exe'
          . ./native/installer/windows-package.ps1
          $metadata = Get-Content app-metadata.json -Raw | ConvertFrom-Json
          $manifest = Write-WindowsInstallManifest $bundle 'PlannerReplayStudio' $version 'Planner Replay Studio Full' 'PlannerReplayStudio.exe'
          $defines = @("/DAPP_DIR=$bundle", "/DSETUP_FILE=$setup", "/DVERSION=$version",
            '/DPRODUCT=Planner Replay Studio Full', '/DPRODUCT_ID=PlannerReplayStudio', '/DAPP_EXE=PlannerReplayStudio.exe',
            "/DINSTALL_MANIFEST_SHA256=$($manifest.sha256)", "/DAUTHOR=$($metadata.author)", "/DPROJECT_URL=$($metadata.github_url)", "/DCONTACT_EMAIL=$($metadata.email)")
          & $compiler /WX @defines native/installer/windows.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed workspace without system Python on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'PlannerReplayStudioSmoke'
          $install = Start-Process -FilePath (Resolve-Path dist/PlannerReplayStudio-Setup.exe).Path -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with $($install.ExitCode)." }
          $exe = Join-Path $target 'app/PlannerReplayStudio.exe'
          $logPath = Join-Path $env:RUNNER_TEMP 'planner-replay-studio-smoke.txt'
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:PYTHONHOME, Env:PYTHONPATH, Env:TCL_LIBRARY, Env:TK_LIBRARY -ErrorAction SilentlyContinue
            $app = Start-Process -FilePath $exe -ArgumentList '--smoke', ('"' + $logPath + '"') -WorkingDirectory $target -Wait -PassThru
            if (Test-Path $logPath) { Get-Content $logPath }
            if ($app.ExitCode -ne 0) { throw "Installed workspace smoke test failed with $($app.ExitCode)." }
          } finally {
            $env:PATH = $originalPath
          }
          $uninstall = Start-Process -FilePath (Join-Path $target 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $exe)) { throw 'Uninstall did not remove the workspace.' }
      - uses: actions/upload-artifact@v4
        with:
          name: PlannerReplayStudio-Windows-x64
          path: dist/PlannerReplayStudio-Setup.exe
          if-no-files-found: error

  # Historical compatibility builds remain available as CI artifacts. Current
  # necessary four-workspace core end-to-end GUI, package dependencies and safe
  # upgrade acceptance precede release; nonblocking UI/edge coverage follows via
  # user post-install testing and PRs, with unverified status retained.
  # Clean-Windows install/run testing is assigned to the user after release.
  # This workflow never publishes a release or removes a rollback tag/asset.
